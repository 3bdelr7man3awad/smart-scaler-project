version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smartfoodscale
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=smartfoodscale
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  food_data_collector:
    build: .
    volumes:
      - ./data:/app/data
      - .env:/app/.env
    environment:
      - USDA_API_KEY=${USDA_API_KEY}
      - OPENFOODFACTS_API_KEY=${OPENFOODFACTS_API_KEY}
    restart: unless-stopped

  tests:
    build: .
    command: pytest tests/ --cov=data_collection
    volumes:
      - ./data:/app/data
      - .env:/app/.env
    environment:
      - USDA_API_KEY=${USDA_API_KEY}
      - OPENFOODFACTS_API_KEY=${OPENFOODFACTS_API_KEY}

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: 